<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | mypet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/mypet.css" rel="stylesheet">
</head>
<body class="user-body">
<div class="container-fluid auth-wrap">
  <div class="row min-vh-100">
    <div class="col-lg-6 auth-side d-none d-lg-flex flex-column justify-content-center">
      <div class="auth-photo c-clinic"><i class="bi bi-heart-pulse"></i><img class="ph-img" src="../assets/img/auth-signin.jpg" alt="" loading="lazy" onerror="this.remove()"></div>
      <a class="mp-brand justify-content-center" href="index.html"><span class="mp-logo"><svg class="paw" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><ellipse cx="6.3" cy="10.2" rx="2" ry="2.6"/><ellipse cx="10.3" cy="5.9" rx="2" ry="2.7"/><ellipse cx="15.5" cy="5.9" rx="2" ry="2.7"/><ellipse cx="19" cy="10.2" rx="2" ry="2.6"/><path d="M12.4 11c-3.2 0-6.2 3.2-6.2 6 0 2 1.6 3.100 3.300 3.100 1.200 0 1.900-.6 2.900-.6s1.700.6 2.900.6c1.700 0 3.300-1.100 3.300-3.100 0-2.800-3-6-6.200-6z"/></svg></span>mypet</a>
      <div class="auth-tag">Book trusted vets near you, anytime</div>
    </div>
    <div class="col-lg-6 d-flex align-items-center justify-content-center py-5 bg-white">
      <div class="auth-form">
        <a class="mp-brand d-lg-none mb-4" href="index.html"><span class="mp-logo"><svg class="paw" viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><ellipse cx="6.3" cy="10.2" rx="2" ry="2.6"/><ellipse cx="10.3" cy="5.9" rx="2" ry="2.7"/><ellipse cx="15.5" cy="5.9" rx="2" ry="2.7"/><ellipse cx="19" cy="10.2" rx="2" ry="2.6"/><path d="M12.4 11c-3.2 0-6.2 3.2-6.2 6 0 2 1.6 3.100 3.300 3.100 1.200 0 1.900-.6 2.900-.6s1.700.6 2.900.6c1.700 0 3.300-1.100 3.300-3.100 0-2.800-3-6-6.200-6z"/></svg></span>mypet</a>
        <h3 class="mb-1">Welcome back</h3>
<p class="text-muted small mb-4">Log in to continue to your account</p>
<form class="needs-validation" novalidate data-auth="signin" data-next="home.html">
  <div class="mb-3"><label class="form-label" for="email">Email</label>
    <div class="input-icon"><i class="bi bi-envelope"></i><input class="form-control" type="email" id="email" name="email" placeholder="you@example.com" required><div class="invalid-feedback">Enter a valid email address.</div></div></div>
  <div class="mb-2"><label class="form-label" for="password">Password</label>
    <div class="input-icon"><i class="bi bi-lock"></i><input class="form-control" type="password" id="password" name="password" placeholder="Your password" minlength="6" required><button type="button" class="pw-toggle" aria-label="Show password"><i class="bi bi-eye"></i></button><div class="invalid-feedback">Password must be at least 6 characters.</div></div></div>
  <div class="d-flex justify-content-between align-items-center small mb-4"><div class="form-check"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">Remember me</label></div><a href="#" data-toast="Password reset is handled by the back-end">Forgot password?</a></div>
  <button class="btn btn-primary w-100 py-2" type="submit">Log in</button>
  <div class="text-center text-muted small my-3">or continue with</div>
  <div class="d-flex gap-2 mb-4"><button type="button" class="btn btn-outline-secondary flex-fill btn-sm" data-toast="Social login is handled by the back-end"><i class="bi bi-google"></i> Google</button><button type="button" class="btn btn-outline-secondary flex-fill btn-sm" data-toast="Social login is handled by the back-end"><i class="bi bi-facebook"></i> Facebook</button></div>
  <div class="text-center small">Don't have an account? <a class="fw-semibold" href="signup.html">Sign up</a></div>
  <div class="text-center text-muted mt-3" style="font-size:.7rem"><a href="../admin/admin-login.html">Admin log in</a></div>
</form>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/app.js"></script>
</body>
</html>
